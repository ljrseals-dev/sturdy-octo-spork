[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rack-doc-analyzer"
version = "0.2.0"
description = "Offline-first pipeline: unzip → classify → local VLM image analysis → OCR → structured JSON for server-room / rack documentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Community / Enhanced from skeleton"}]
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
rack-analyze = "src.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
